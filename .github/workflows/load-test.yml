name: Manual load test

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Workload profile
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - average-load
          - stress
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      base_url:
        description: Authorized HTTP or HTTPS target
        required: true
        type: string
      test_id:
        description: Stable identifier for this run
        required: true
        default: manual
        type: string
      allow_production_load:
        description: Explicitly allow stress against production
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: load-test-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up k6
        uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
        with:
          k6-version: 2.1.0

      - name: Install dependencies
        run: npm ci

      - name: Validate suite
        run: npm run check

      - name: Run selected workload
        env:
          ALLOW_PRODUCTION_LOAD: ${{ inputs.allow_production_load }}
          BASE_URL: ${{ inputs.base_url }}
          ENVIRONMENT: ${{ inputs.environment }}
          K6_OTEL_GRPC_EXPORTER_ENDPOINT: ${{ secrets.K6_OTEL_GRPC_EXPORTER_ENDPOINT }}
          K6_OTEL_GRPC_EXPORTER_INSECURE: ${{ vars.K6_OTEL_GRPC_EXPORTER_INSECURE || 'false' }}
          K6_OTEL_METRIC_PREFIX: k6_
          K6_OTEL_SERVICE_NAME: k6-continuous-performance
          TEST_ID: ${{ inputs.test_id }}
          WORKLOAD: ${{ inputs.workload }}
        run: |
          case "$WORKLOAD" in
            smoke)
              script="src/tests/smoke.ts"
              ;;
            average-load)
              script="src/tests/average-load.ts"
              ;;
            stress)
              script="src/tests/stress.ts"
              ;;
            *)
              echo "Unsupported workload: $WORKLOAD"
              exit 1
              ;;
          esac

          if [[ "$WORKLOAD" == "stress" && "$ENVIRONMENT" == "production" && "$ALLOW_PRODUCTION_LOAD" != "true" ]]; then
            echo "Production stress requires explicit approval."
            exit 1
          fi

          mkdir -p results
          outputs=(--summary-export results/summary.json)

          if [[ -n "$K6_OTEL_GRPC_EXPORTER_ENDPOINT" ]]; then
            outputs+=(--out opentelemetry)
          fi

          k6 run \
            "${outputs[@]}" \
            -e BASE_URL="$BASE_URL" \
            -e ENVIRONMENT="$ENVIRONMENT" \
            -e TEST_ID="$TEST_ID" \
            -e ALLOW_LOAD_TEST=true \
            -e ALLOW_PRODUCTION_LOAD="$ALLOW_PRODUCTION_LOAD" \
            "$script"

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: k6-${{ inputs.workload }}-${{ github.run_id }}
          path: results/summary.json
          if-no-files-found: warn
          retention-days: 14
